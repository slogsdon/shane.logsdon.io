# ---------------------------------------------------------------------------
# Security + caching headers. CSP ships Report-Only first (inline styles/
# scripts, GA4, Giscus, SpeakerDeck, Vimeo, Google Fonts allowed) — review a
# week of reports, then promote to Content-Security-Policy to enforce.
# ---------------------------------------------------------------------------

[[headers]]
for = "/*"
  [headers.values]
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "SAMEORIGIN"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
  Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
  Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com https://region1.google-analytics.com; frame-src https://giscus.app https://speakerdeck.com https://player.vimeo.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://app.kit.com"

[[headers]]
for = "/images/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/_/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"
