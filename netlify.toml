[build]
command = "npm install && npm run build:css && composer clean && composer build && php scripts/generate-md.php"
publish = "dist"

[[plugins]]
package = "@netlify/plugin-sitemap"
  [plugins.inputs]
  exclude = [
    './dist/thanks/**/*',
    '404.html',
    'google*.html'
  ]
  prettyURLs = true
  trailingSlash = true

[[plugins]]
  package = "netlify-plugin-submit-sitemap"

	[plugins.inputs]
	providers = [
		"google"
	]

[[plugins]]
package = "@netlify/plugin-lighthouse"




# ---------------------------------------------------------------------------
# Host normalization: force apex + https. Also set the Netlify primary domain
# (Domain settings) so the dashboard-level redirect is a 301 as well.
# ---------------------------------------------------------------------------

[[redirects]]
from = "https://www.shane.logsdon.io/*"
to = "https://shane.logsdon.io/:splat"
status = 301
force = true

[[redirects]]
from = "https://shanelogsdon.com/*"
to = "https://shane.logsdon.io/:splat"
status = 301
force = true

[[redirects]]
from = "https://www.shanelogsdon.com/*"
to = "https://shane.logsdon.io/:splat"
status = 301
force = true

