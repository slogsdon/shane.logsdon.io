<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Page not found · Shane Logsdon</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbfaf9">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/images/icons/icon-192x192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  :root{
    --bg:hsl(40 22% 98%);
    --fg:hsl(220 14% 7%);
    --soft:hsl(222 12% 28%);
    --muted:hsl(220 6% 41%);
    --rule:hsl(224 9% 86%);
    --accent:hsl(82 39% 30%);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit}
  .wrap{max-width:52rem;margin:0 auto;width:100%;padding:0 1.5rem}
  header{border-bottom:1px solid var(--rule)}
  header .wrap{display:flex;align-items:center;justify-content:space-between;height:3.5rem}
  .wordmark{font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:1.05rem;text-decoration:none}
  nav a{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;margin-left:1.25rem}
  nav a:hover{color:var(--fg)}
  main{flex:1;display:flex;align-items:center}
  main .wrap{padding-top:4rem;padding-bottom:5rem}
  .eyebrow{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:400;font-size:clamp(3rem,10vw,6rem);line-height:.98;letter-spacing:-.02em;margin:1.5rem 0}
  h1 .accent{color:var(--accent)}
  .lead{font-size:1.0625rem;color:var(--soft);max-width:38ch}
  .links{margin-top:2.5rem;display:flex;flex-wrap:wrap;gap:1rem 2rem}
  .links a{font-size:.9rem;text-decoration:none;border-bottom:1px solid var(--rule);padding-bottom:2px}
  .links a:hover{border-color:var(--fg)}
  footer{border-top:1px solid var(--rule)}
  footer .wrap{display:flex;flex-wrap:wrap;gap:1rem;align-items:baseline;justify-content:space-between;padding-top:1.75rem;padding-bottom:1.75rem;font-size:.75rem;color:var(--muted)}
  footer a{text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a href="/" class="wordmark">Shane Logsdon</a>
    <nav>
      <a href="/about/">About</a>
      <a href="/articles/">Articles</a>
      <a href="/contact/">Contact</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <p class="eyebrow">Error 404</p>
    <h1>Page not <span class="accent">found</span>.</h1>
    <p class="lead">This URL doesn&rsquo;t exist, or it moved during a site migration. Here&rsquo;s the way back.</p>
    <div class="links">
      <a href="/">Home</a>
      <a href="/articles/">Read the writing</a>
      <a href="/work/">Selected work</a>
      <a href="/about/">About Shane</a>
      <a href="/contact/">Get in touch</a>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>Shane Logsdon</span>
    <span>Louisville, KY</span>
  </div>
</footer>
</body>
</html>
