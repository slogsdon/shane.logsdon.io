<script src="globalpayments-3ds.js"></script>
<script>
  const queryString = window.location.search.split('&');
  const data = [];
  for (const i = 0; i < queryString.length; i++) {
   const item = queryString[i].split('=');
   data[item[0]] = item[1];
  }

  const threeDSMethodData = JSON.parse(atob(data['threeDSMethodData']));
  GlobalPayments.ThreeDSecure.handleMethodNotification(threeDSMethodData['threeDSServerTransID'], 'https://' + data['host']);
</script>
