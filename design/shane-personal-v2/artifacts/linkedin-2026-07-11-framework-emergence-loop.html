<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shane Logsdon — LinkedIn — The Framework Emergence Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* ─── Tokens (embedded verbatim from tokens.css) ─── */
  :root {
    --color-surface:         #fbfaf9;
    --color-surface-feature: #ede4d2;
    --color-surface-muted:   #f1eee8;
    --color-ink:             #0e1116;
    --color-ink-soft:        #404550;
    --color-ink-3:           #62686f;
    --color-rule:            #d6d8de;
    --color-grid:            #e0e2e6;
    --color-accent:          #556b2f;
    --color-accent-hover:    #3e5020;

    --type-display-family:   'Fraunces', 'Iowan Old Style', Georgia, serif;
    --type-sans-family:      'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    --type-mono-family:      'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

    --fs-display-xxl:  9rem;
    --fs-display-xl:   6rem;
    --fs-display:      4.5rem;
    --fs-headline-lg:  3.5rem;
    --fs-headline-md:  2.25rem;
    --fs-headline-sm:  1.5rem;
    --fs-lead:         1.1875rem;
    --fs-body-lg:      1.0625rem;
    --fs-body-md:      1rem;
    --fs-meta:         0.875rem;
    --fs-smallcaps-lg: 0.875rem;
    --fs-smallcaps:    0.75rem;
    --fs-dateline:     0.75rem;
    --fs-code:         0.875rem;

    --lh-cover:        0.96;
    --lh-tight:        1.0;
    --lh-snug:         1.05;
    --lh-normal:       1.18;
    --lh-prose:        1.65;

    --tracking-cover:    -0.022em;
    --tracking-display:  -0.02em;
    --tracking-tight:    -0.015em;
    --tracking-normal:   0;
    --tracking-smallcaps: 0.08em;
    --tracking-smallcaps-tight: 0.06em;
    --tracking-mono:     0.06em;

    --s-1:  0.25rem;  --s-2:  0.5rem;   --s-3:  0.75rem;  --s-4:  1rem;
    --s-5:  1.5rem;   --s-6:  2rem;     --s-7:  3rem;     --s-8:  4rem;
    --s-9:  6rem;     --s-10: 9rem;

    --measure:    64ch;
    --container:  1180px;
    --gutter:     1.5rem;

    --r-0:        0;
    --r-hairline: 1px;
    --r-sm:       2px;
    --r-full:     999px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #2a2a2a;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px;
  }

  /* ─── THE CANVAS — exact LinkedIn dimensions ─── */
  .canvas {
    width: 1200px;
    height: 627px;
    background: var(--color-surface);
    color: var(--color-ink);
    position: relative;
    overflow: hidden;
    padding: var(--s-8);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* ─── Object identity — the document's own filename, not chrome ─── */
  .doc-path {
    font-family: var(--type-mono-family);
    font-size: var(--fs-dateline);
    letter-spacing: var(--tracking-mono);
    color: var(--color-ink-3);
  }
  .doc-rule {
    height: 1px;
    background: var(--color-rule);
    margin-top: var(--s-3);
  }

  /* ─── The document's discovered title + its finding ─── */
  .body-block { padding-top: var(--s-6); }
  .headline {
    font-family: var(--type-display-family);
    font-weight: 500;
    font-size: var(--fs-headline-lg);
    line-height: 1.1;
    letter-spacing: var(--tracking-tight);
    color: var(--color-ink);
    max-width: 18ch;
  }
  .support {
    font-family: var(--type-sans-family);
    font-weight: 400;
    font-size: var(--fs-lead);
    line-height: var(--lh-prose);
    color: var(--color-ink-soft);
    max-width: 52ch;
    margin-top: var(--s-5);
  }

  /* ─── The emergence loop — a diagram fragment from the rebuild log ─── */
  .loop {
    position: relative;
    margin-top: var(--s-6);
  }
  .loop .row {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
  }
  .node {
    text-align: center;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--color-rule);
    position: relative;
  }
  .node .cap {
    font-family: var(--type-mono-family);
    font-size: var(--fs-dateline);
    letter-spacing: var(--tracking-mono);
    color: var(--color-ink-3);
    display: block;
  }
  .node .ver {
    font-family: var(--type-mono-family);
    font-size: var(--fs-code);
    letter-spacing: var(--tracking-mono);
    color: var(--color-ink);
    display: block;
    margin-top: 4px;
  }
  .node .dot {
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 10px;
    background: var(--color-ink);
  }
  .loop svg { display: block; margin: 4px auto 0; }

  @page { size: 1200px 627px; margin: 0; }
  @media print {
    body { background: var(--color-surface); padding: 0; }
    .canvas { box-shadow: none; }
  }
</style>
</head>
<body>
<!--
Variation choices (cross-artifact check vs LinkedIn series):
  archetype:    object-of-content — the canvas IS a fragment of the rebuild log: a
                discovered title + finding, then the six-iteration emergence loop drawn as a
                diagram pulled straight from the workflow. The "post" frame disappears; this
                looks like a page out of the journal that produced the article.
                Differs from the immediate predecessor (2026-07-11 pattern-led, whose ledger
                was a faint decorative field beside a chrome headline). Here the whole surface
                is the object; there is no separate headline+ledger framing.
  layout:       document / full-bleed-block — filename header, then title block, then the
                loop diagram pinned to the bottom edge. Not a split, not centered.
  type-press:   display-dominant — Fraunces title carries the voice; JetBrains Mono owns the
                log's filename, version tags, and iteration captions (mono in its proper role);
                IBM Plex only for the finding sentence.
  color:        committed cream + ink, with the accent used in ONE semantic role — the return
                arc of the loop (the thesis made visible). No single-word color emphasis.
  composition:  object-led — the loop diagram is the content, not ornament.
  Chrome:       no eyebrow, no running head, no footer signature (attribution omitted per
                brief). Differs from the prior lower-left wordmark+folio stack, which is absent
                here — the mark placement rotates to "omitted."
-->
<article class="canvas">

  <header>
    <span class="doc-path">rebuild-log.md</span>
    <div class="doc-rule"></div>
  </header>

  <div class="body-block">
    <h1 class="headline">The Framework Emergence Loop: How Durable AI Workflows</h1>
    <p class="support">Durable AI workflows aren't designed upfront, they're found through repeated rebuilding. Six iterations reveal why the framework emergence loop works.</p>
  </div>

  <div class="loop" aria-label="six rebuild iterations forming an emergence loop">
    <div class="row">
      <div class="node"><span class="cap">plan it</span><span class="ver">v1</span><span class="dot"></span></div>
      <div class="node"><span class="cap">breaks</span><span class="ver">v2</span><span class="dot"></span></div>
      <div class="node"><span class="cap">keep it</span><span class="ver">v3</span><span class="dot"></span></div>
      <div class="node"><span class="cap">breaks</span><span class="ver">v4</span><span class="dot"></span></div>
      <div class="node"><span class="cap">keep it</span><span class="ver">v5</span><span class="dot"></span></div>
      <div class="node"><span class="cap">it holds</span><span class="ver">v6</span><span class="dot"></span></div>
    </div>
    <svg width="1072" height="34" viewBox="0 0 1072 34" fill="none" aria-hidden="true">
      <defs>
        <marker id="arrow" markerWidth="9" markerHeight="9" refX="5.5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#556b2f"></path>
        </marker>
      </defs>
      <path d="M 1012 7 C 980 30, 92 30, 60 7"
            stroke="#556b2f" stroke-width="1.5" fill="none" marker-end="url(#arrow)"></path>
      <text x="536" y="30" text-anchor="middle"
            font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="0.06em"
            fill="#556b2f">the emergence loop</text>
    </svg>
  </div>

</article>
</body>
</html>
<!--
COMPANION TEXT (style: insight — claim → reasoning → invitation):

Durable AI workflows aren't designed. They're found.

I rebuilt ours six times. Every version failed the moment it met a real task — and every failure left behind the one part that actually held. The framework wasn't drawn up front. It's the residue of what survived the rebuilds.

What's the rebuild that taught you the most? I'm collecting them.
-->
