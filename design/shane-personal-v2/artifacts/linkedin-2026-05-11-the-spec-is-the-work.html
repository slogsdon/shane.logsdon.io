<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shane Logsdon — LinkedIn — the-spec-is-the-work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════════
   tokens.css — Shane Logsdon v2 (embedded verbatim)
   ═══════════════════════════════════════════════════════════════ */

:root {
  /* ─── Color ─── */
  --color-surface:         #fbfaf9;
  --color-surface-feature: #ede4d2;
  --color-surface-muted:   #f1eee8;
  --color-ink:             #0e1116;
  --color-ink-soft:        #404550;
  --color-ink-3:           #62686f;
  --color-rule:            #d6d8de;
  --color-grid:            #e0e2e6;
  --color-accent:          #556b2f;
  --color-accent-hover:    #3e5020;

  /* ─── Type families ─── */
  --type-display-family: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  --type-sans-family:    'Inter', ui-sans-serif, system-ui, sans-serif;
  --type-mono-family:    'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  /* ─── Display scale ─── */
  --fs-display-xxl: 9rem;
  --fs-display-xl:  6rem;
  --fs-display:     4.5rem;
  --fs-headline-lg: 3.5rem;
  --fs-headline-md: 2.25rem;
  --fs-headline-sm: 1.5rem;

  /* ─── Body ─── */
  --fs-lead:         1.1875rem;
  --fs-body-lg:      1.0625rem;
  --fs-body-md:      1rem;
  --fs-meta:         0.875rem;
  --fs-smallcaps-lg: 0.875rem;
  --fs-smallcaps:    0.75rem;
  --fs-dateline:     0.75rem;
  --fs-code:         0.875rem;

  /* ─── Line heights ─── */
  --lh-cover:  0.96;
  --lh-tight:  1.0;
  --lh-snug:   1.05;
  --lh-normal: 1.18;
  --lh-prose:  1.65;

  /* ─── Letter-spacing ─── */
  --tracking-cover:           -0.022em;
  --tracking-display:         -0.02em;
  --tracking-tight:           -0.015em;
  --tracking-normal:           0;
  --tracking-smallcaps:        0.08em;
  --tracking-smallcaps-tight:  0.06em;
  --tracking-mono:             0.06em;

  /* ─── Spacing ─── */
  --s-1: 0.25rem;  --s-2: 0.5rem;  --s-3: 0.75rem;  --s-4: 1rem;
  --s-5: 1.5rem;   --s-6: 2rem;    --s-7: 3rem;      --s-8: 4rem;
  --s-9: 6rem;     --s-10: 9rem;

  /* ─── Layout ─── */
  --measure:   64ch;
  --container: 1180px;
  --gutter:    1.5rem;

  /* ─── Radii ─── */
  --r-0:        0;
  --r-hairline: 1px;
  --r-sm:       2px;
  --r-full:     999px;

  /* ─── Motion ─── */
  --ease: cubic-bezier(0.2, 0.6, 0.2, 1);
  --dur:  200ms;
}

/* ─── Type utilities ─── */
.t-display-xxl { font-family: var(--type-display-family); font-weight: 400; font-size: var(--fs-display-xxl); line-height: var(--lh-cover); letter-spacing: var(--tracking-cover); }
.t-display-xl  { font-family: var(--type-display-family); font-weight: 400; font-size: var(--fs-display-xl); line-height: var(--lh-tight); letter-spacing: var(--tracking-display); }
.t-display     { font-family: var(--type-display-family); font-weight: 400; font-size: var(--fs-display); line-height: var(--lh-snug); letter-spacing: var(--tracking-display); }
.t-headline-lg { font-family: var(--type-display-family); font-weight: 500; font-size: var(--fs-headline-lg); line-height: 1.1; letter-spacing: var(--tracking-tight); }
.t-headline-md { font-family: var(--type-display-family); font-weight: 500; font-size: var(--fs-headline-md); line-height: var(--lh-normal); letter-spacing: var(--tracking-tight); }
.t-headline-sm { font-family: var(--type-display-family); font-weight: 500; font-size: var(--fs-headline-sm); line-height: 1.3; }
.t-lead        { font-family: var(--type-sans-family); font-size: var(--fs-lead); line-height: var(--lh-prose); color: var(--color-ink); }
.t-body        { font-family: var(--type-sans-family); font-size: var(--fs-body-lg); line-height: var(--lh-prose); color: var(--color-ink); }
.t-meta        { font-family: var(--type-sans-family); font-size: var(--fs-meta); line-height: 1.5; color: var(--color-ink-3); }
.t-smallcaps-lg {
  font-family: var(--type-display-family); font-weight: 600;
  font-variant-caps: small-caps; font-feature-settings: 'smcp';
  text-transform: lowercase; font-size: var(--fs-smallcaps-lg); line-height: 1;
  letter-spacing: var(--tracking-smallcaps); color: var(--color-ink);
}
.t-smallcaps {
  font-family: var(--type-display-family); font-weight: 600;
  font-variant-caps: small-caps; font-feature-settings: 'smcp';
  text-transform: lowercase; font-size: var(--fs-smallcaps); line-height: 1;
  letter-spacing: 0.1em; color: var(--color-ink-3);
}
.t-dateline { font-family: var(--type-mono-family); font-size: var(--fs-dateline); letter-spacing: var(--tracking-mono); color: var(--color-ink-3); }
.t-accent   { color: var(--color-accent); font-style: normal; }

/* ─── Inversion ─── */
.inversion {
  background: var(--color-ink);
  color: var(--color-surface);
  --color-ink:      var(--color-surface);
  --color-ink-soft: rgba(251,250,249,0.72);
  --color-ink-3:    rgba(251,250,249,0.55);
  --color-rule:     rgba(251,250,249,0.18);
}

/* ─── Rules ─── */
.rule        { height: 1px; background: var(--color-rule); border: 0; margin: 0; }
.column-rule { width: 1px; background: var(--color-rule); }

/* ─── Running head ─── */
.running-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 24px;
  padding-bottom: 12px; border-bottom: 1px solid var(--color-rule);
  font-family: var(--type-display-family); font-weight: 600;
  font-variant-caps: small-caps; font-feature-settings: 'smcp';
  text-transform: lowercase; font-size: var(--fs-smallcaps); letter-spacing: 0.1em;
  color: var(--color-ink);
}

/* ─── Wordmark ─── */
.wordmark { font-family: var(--type-display-family); font-weight: 600; font-size: 22px; letter-spacing: -0.005em; color: var(--color-ink); }

/* ─── Folio ─── */
.folio {
  display: inline-flex; align-items: baseline; gap: 12px;
  font-family: var(--type-mono-family); font-size: var(--fs-dateline);
  letter-spacing: var(--tracking-mono); color: var(--color-ink-3);
}
.folio .pos { color: var(--color-ink); }

/* ─── Btn-arrow ─── */
.btn-arrow { display: inline; font-family: var(--type-sans-family); font-size: var(--fs-body-md); font-weight: 400; color: var(--color-ink); text-decoration: underline; text-decoration-color: var(--color-rule); text-decoration-thickness: 1px; text-underline-offset: 5px; }
.btn-arrow::after { content: ' →'; font-family: var(--type-mono-family); font-size: 0.85em; }

/* ═══════════════════════════════════════════════════════════════
   Page shell
   ═══════════════════════════════════════════════════════════════ */
html, body {
  margin: 0; padding: 0;
  background: #2a2a2a;
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: var(--type-sans-family);
}

/* ═══════════════════════════════════════════════════════════════
   Canvas — 1200×627 exact (LinkedIn spec)
   ═══════════════════════════════════════════════════════════════ */
.canvas {
  width: 1200px;
  height: 627px;
  /* Literal hex required: var(--color-ink) self-overrides to cream when --color-ink
     is redefined on the same element. Background must be set before the token swap. */
  background: #0e1116;
  color: #fbfaf9;

  /* Redefine tokens for any descendants that use var(--color-*) */
  --color-ink:      #fbfaf9;
  --color-ink-soft: rgba(251,250,249,0.72);
  --color-ink-3:    rgba(251,250,249,0.55);
  --color-rule:     rgba(251,250,249,0.18);

  position: relative;
  overflow: hidden;
  box-sizing: border-box;
  flex-shrink: 0;

  /* Off-grid: headline bottom-anchored; top 40% is pure dark negative space */
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 0 80px 68px;
}

/* ─── Headline ─── */
.headline {
  font-family: var(--type-display-family);
  font-weight: 400;
  font-size: var(--fs-display-xxl);    /* 144px — cover scale */
  line-height: var(--lh-cover);        /* 0.96 */
  letter-spacing: var(--tracking-cover); /* -0.022em */
  color: #fbfaf9;                       /* cream — literal to match canvas inversion */
  margin: 0;
  padding: 0;
}

/* Print / export */
@page { size: 1200px 627px; margin: 0; }
@media print {
  html, body { background: #0e1116; }
  .canvas { box-shadow: none; }
}
</style>
</head>
<body>

<!--
  Variation choices:
    archetype:  type-only — nothing but the headline; no eyebrow, no footer, no rules; the type IS the artifact
    layout:     off-grid — headline bottom-anchored; top 40% of canvas is pure dark negative space; deliberate weight imbalance
    color:      inverted — full dark canvas (ink bg, cream text); olive omitted (fails AA on dark at this scale)
    type-press: display-dominant — Fraunces 144px cover scale; three-line stacked break
    composition: headline-led

  Cross-artifact check (LinkedIn):
    linkedin-2026-05-07: number-led × asymmetric × single-accent × data-led
    linkedin-2026-05-04: object-of-content × full-bleed × monochrome × data-led
    linkedin-2026-05-03: pattern-led × asymmetric × monochrome × display-dominant
    THIS:               type-only × off-grid × inverted × display-dominant — new archetype, new color register ✓

  Blog hero for same article (for contrast awareness):
    blog-hero-2026-05-11: pattern-led × asymmetric × cream surface × single-accent
    LinkedIn uses:         type-only × off-grid × inverted — opposite color register ✓

  Wordmark placement: omitted entirely (type-only archetype discipline; LinkedIn profile above image carries attribution)
  Footer: none (type-only — no footer chrome)

  Anti-pattern compliance:
    § No single-word color emphasis (accent omitted on dark — contrast insufficient) ✓
    § No center-aligned composition (bottom-anchored, left-aligned) ✓
    § No 3-column footer row (no footer at all) ✓
    § No editorial cosplay markers ✓
    § No gradients, orbs, circuit patterns ✓
    § Inner block matches outer archetype (headline only — no chrome-led revert) ✓
-->

<article class="canvas">
  <h1 class="headline">
    The<br>
    Spec<br>
    Is&nbsp;the&nbsp;Work.
  </h1>
</article>

<!--
COMPANION TEXT (insight style — claim → reasoning → invitation):

Your agent didn't fail. You never wrote the spec.

When AI-assisted builds stall — and they stall at the same place every time — the cause is almost never the model. It's that someone opened the AI tool before the design decisions were made. The agent filled in the gaps. The gaps were everywhere.

A spec isn't a waterfall artifact. It's three things: the design decisions you're actually committing to, the interface contract the agent must honor, and the failure modes you've enumerated before they surface in production. Write those down. Then open the AI tool.

The spec isn't prep for the work. The spec is the work.

(Link to full article in first comment.)
-->
