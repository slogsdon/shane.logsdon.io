/* ═══════════════════════════════════════════════════════════════

<!--
COMPANION TEXT:

Most local business owners I talk to have heard of SEO. Fewer than one in ten has heard of AEO, and almost none of them know what it actually requires.

AEO (Answer Engine Optimization) is not SEO renamed. It is structuring your web site so AI assistants — ChatGPT, Perplexity, Google's AI Overviews — can extract your business as a citation when someone asks for a recommendation. The AI is not returning a results page. It is returning an answer. If your site is not structured for extraction, you are not a candidate for that answer, regardless of your search ranking.

The structural signals are specific: FAQPage schema markup, Quick Answer blocks at the top of key pages, an llms.txt file at your root, open access for AI crawlers in your robots.txt, and content organized around clear questions and direct answers.

For most local sites, implementing all five takes a few hours of structured work. The window to do it before it becomes table stakes is real and short.

I wrote the full breakdown for business owners who want to understand what this is before hiring someone to do it. Link in the first comment.
