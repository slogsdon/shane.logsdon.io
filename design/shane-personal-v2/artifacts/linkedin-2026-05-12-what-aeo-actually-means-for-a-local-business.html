<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<style>

:root {
  --color-surface: #fbfaf9;
  --color-ink: #0e1116;
  --color-accent: #556b2f;
  --color-rule: #d6d8de;
  --type-sans-family: sans-serif;
}
.canvas {
  width: 1200px;
  height: 627px;
  background: var(--color-surface);
  color: var(--color-ink);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 80px;
  font-family: var(--type-sans-family);
  position: relative;
  overflow: hidden;
  box-sizing: border-box;
}
.headline {
  font-size: 48px;
  font-weight: 700;
  margin-bottom: 24px;
  line-height: 1.1;
}
.description {
  font-size: 24px;
  line-height: 1.4;
  color: #404550;
  margin-bottom: 48px;
}
.eyebrow {
  font-size: 18px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--color-accent);
  margin-bottom: 12px;
  font-weight: 600;
}
.footer {
  margin-top: auto;
  padding-top: 24px;
  border-top: 1px solid var(--color-rule);
  font-size: 16px;
  color: #62686f;
}

</style>
</head>
<body>
  <div class='canvas'>
    <div class='eyebbarow'>strategic insights</div>
    <h1 class='headline'>What AEO actually means for a local business.</h1>
    <p class='description'>Answer engine optimization structures your web site so AI assistants can extract and cite your business when someone asks for a local recommendation. Here's what it actually requires.</p>
    <div class='footer'>2026-05-12</div>
  </div>
</body>
</html>
